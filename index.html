<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Synapse</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;
overflow:hidden;

background:
radial-gradient(circle at center,
#0e1322 0%,
#090d17 40%,
#05070c 100%);

font-family:
-apple-system,
BlinkMacSystemFont,
Segoe UI,
Roboto,
sans-serif;

color:white;

touch-action:none;

}

canvas{

position:absolute;
inset:0;

width:100%;
height:100%;

display:block;

}

#menu{

position:absolute;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

backdrop-filter:blur(18px);

background:rgba(0,0,0,.28);

}

h1{

font-size:58px;

font-weight:200;

letter-spacing:12px;

margin-bottom:10px;

}

p{

opacity:.75;

margin-bottom:50px;

font-size:18px;

}

button{

border:none;

padding:

18px 42px;

border-radius:18px;

font-size:18px;

background:

linear-gradient(

180deg,

#4fd7ff,

#1598ff);

color:white;

box-shadow:

0 0 30px rgba(60,180,255,.4);

}

button:active{

transform:scale(.96);

}

#version{

position:absolute;

bottom:20px;

opacity:.4;

font-size:13px;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<h1>SYNAPSE</h1>

<p>Version 0.0.1</p>

<button id="start">

Start

</button>

<div id="version">

Entwickelt mit ❤️

</div>

</div>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

function resize(){

canvas.width=window.innerWidth*devicePixelRatio;

canvas.height=window.innerHeight*devicePixelRatio;

ctx.scale(devicePixelRatio,devicePixelRatio);

}

resize();

window.addEventListener("resize",resize);

let particles=[];

for(let i=0;i<120;i++){

particles.push({

x:Math.random()*innerWidth,

y:Math.random()*innerHeight,

r:Math.random()*2+0.5,

s:Math.random()*0.4+0.15

});

}

function draw(){

ctx.clearRect(0,0,innerWidth,innerHeight);

for(let p of particles){

ctx.beginPath();

ctx.fillStyle="rgba(120,210,255,.55)";

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fill();

p.y-=p.s;

if(p.y<0){

p.y=innerHeight;

p.x=Math.random()*innerWidth;

}

}

requestAnimationFrame(draw);

}

draw();

document.getElementById("start").onclick=()=>{

alert("Das eigentliche Spiel beginnt in Version 0.0.2 😊");

};

</script>

</body>

</html>
